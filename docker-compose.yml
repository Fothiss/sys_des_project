services:
  rustfs:
    image: rustfs/rustfs:1.0.0-beta.7
    container_name: rustfs
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web Console
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ADDRESS: "0.0.0.0:9000"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  s3-init:
    image: amazon/aws-cli:2.39.1
    container_name: s3-init
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY}
      AWS_DEFAULT_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET}
      MLFLOW_BUCKET: ${MLFLOW_BUCKET:-mlflow}
    entrypoint: >
      /bin/sh -c "
      for b in $${S3_BUCKET} $${MLFLOW_BUCKET}; do
        aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket $$b 2>/dev/null ||
        aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket $$b;
        echo \"Bucket ready: $$b\";
      done
      "
    restart: "no"
    
  postgres:
    image: postgres:16.4-alpine
    container_name: mlflow-postgres
    environment:
      POSTGRES_USER: ${MLFLOW_DB_USER:-mlflow}
      POSTGRES_PASSWORD: ${MLFLOW_DB_PASSWORD}
      POSTGRES_DB: ${MLFLOW_DB_NAME:-mlflow}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    container_name: mlflow
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
    ports:
      - "5000:5000"
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://rustfs:9000
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY}
      AWS_DEFAULT_REGION: us-east-1
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      MLFLOW_SERVER_ALLOWED_HOSTS: "mlflow:5000,localhost:*"
    command: >
      mlflow server
      --backend-store-uri postgresql://${MLFLOW_DB_USER:-mlflow}:${MLFLOW_DB_PASSWORD}@postgres:5432/${MLFLOW_DB_NAME:-mlflow}
      --serve-artifacts
      --artifacts-destination s3://${MLFLOW_BUCKET:-mlflow}/
      --host 0.0.0.0
      --port 5000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  train:
    build:
      context: .
      dockerfile: Dockerfile
    image: sys_des_project-train:latest
    profiles: ["tools"]          # up -d его не запускает; запускаем через compose run
    working_dir: /app
    depends_on:
      rustfs:
        condition: service_healthy
      mlflow:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
    environment:
      S3_ENDPOINT: http://rustfs:9000
      S3_BUCKET: ${S3_BUCKET}
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      GIT_COMMIT: ${GIT_COMMIT:-unknown}
      GIT_PYTHON_REFRESH: quiet
    volumes:
      - train_data:/app/data
      - ./runs:/app/runs
      - ./configs:/app/configs:ro

volumes:
  rustfs_data:
  pgdata:
  train_data: