services:
  rustfs:
    image: rustfs/rustfs:1.0.0-beta.7
    container_name: rustfs
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web Console
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ADDRESS: "0.0.0.0:9000"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  s3-init:
    image: amazon/aws-cli:2.39.1
    container_name: s3-init
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY}
      AWS_DEFAULT_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET}
    entrypoint: >
      /bin/sh -c "
      aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket $${S3_BUCKET} 2>/dev/null ||
      aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket $${S3_BUCKET} &&
      echo 'Bucket ready: '$${S3_BUCKET}
      "
    restart: "no"

volumes:
  rustfs_data: