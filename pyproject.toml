[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "sys_des_project"
version = "0.0.1"
description = "Study project"
authors = [
  { name = "Fothiss" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.10.0"
dependencies = [
    "loguru",
    "matplotlib",
    "numpy",
    "pandas",
    "python-dotenv",
    "scikit-learn",
    "tqdm",
    "typer",
]

[dependency-groups]
dev = [
    "ipython",
    "jupyterlab",
    "mypy",
    "notebook",
    "pre-commit",
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 99
src = ["sys_des_project"]
include = ["pyproject.toml", "sys_des_project/**/*.py"]
exclude = [".venv", "__pycache__", "build", "dist"]

[tool.ruff.lint]
extend-select = ["B", "UP", "I", "SIM"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["sys_des_project"]
force-sort-within-sections = true

[tool.mypy]
strict = true
ignore_missing_imports = true
exclude = ["__pycache__", ".venv", "build", "dist"]

