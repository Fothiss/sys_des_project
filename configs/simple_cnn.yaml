experiment_name: cifar10-simple-cnn
run_name: cnn-lr0.001-bs128-seed42
seed: 42

data:
  s3_path: processed/cifar10/v1
  local_dir: null           # null -> data/processed/cifar10/v1
  max_train_samples: null   # число или null (для быстрых прогонов)

model:
  type: simple_cnn
  params:
    channels: [32, 64]

train:
  epochs: 10
  batch_size: 128
  lr: 0.001
  weight_decay: 0.0
  num_workers: 0
  augment: false
  optimizer: adam